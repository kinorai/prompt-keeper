name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.github/workflows/docs.yml'

permissions: {}

jobs:
  build-and-deploy-docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    # Pushes the generated site to gh-pages
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      # First try to restore the cache
      # Actions/setup-node handles caching now, so explicit cache steps are removed.

      - name: Install dependencies
        run: npm ci  --prefer-offline --no-audit

      # TypeDoc is a pinned devDependency, installed from the lockfile by npm ci
      - name: Generate API documentation
        run: npx --no-install typedoc --entryPointStrategy expand --out docs/api src

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
