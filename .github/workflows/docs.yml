name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.github/workflows/docs.yml'

permissions: {}

# typedoc runs project and dependency code, so the build job only gets a
# read-only token. Only the deploy job, which runs no npm code, may push to
# gh-pages.
jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # TypeDoc is a pinned devDependency, installed from the lockfile by npm ci
      - name: Generate API documentation
        run: npx --no-install typedoc --entryPointStrategy expand --out docs/api src

      - name: Upload documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: docs/
          if-no-files-found: error
          retention-days: 1

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    # The only job with a write token. It runs no npm or project code: it
    # pushes the built site to gh-pages.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
