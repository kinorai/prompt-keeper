name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - '.github/workflows/docs.yml'

jobs:
  build-and-deploy-docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      # First try to restore the cache
      # Actions/setup-node handles caching now, so explicit cache steps are removed.

      - name: Install dependencies
        run: npm ci  --prefer-offline --no-audit

      - name: Install TypeDoc
        run: npm install --no-save typedoc

      - name: Generate API documentation
        run: npx typedoc --entryPointStrategy expand --out docs/api src

      - name: Update README badges
        run: |
          sed -i 's|!\[CI\](.*)|![CI](https://github.com/${{ github.repository }}/actions/workflows/ci.yml/badge.svg)|g' README.md
          sed -i 's|!\[Security\](.*)|![Security](https://github.com/${{ github.repository }}/actions/workflows/security.yml/badge.svg)|g' README.md

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
