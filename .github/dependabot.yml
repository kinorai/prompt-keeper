# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Same 7 days as min-release-age in .npmrc: a version bump waits until the
    # release is a week old, so a hijacked publish is pulled before it lands
    # here. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      # All auto-fixable security advisories -> one consolidated PR
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine version bumps: production deps in their own PR for review
      npm-production:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
      # Routine version bumps: dev/tooling deps grouped together (low risk)
      npm-development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    # Actions are pinned to commit SHAs. Dependabot bumps the SHA and rewrites
    # the trailing version comment. The cooldown holds a new release for 7 days
    # so a poisoned tag or release is caught before it lands here (GitHub's
    # built-in default is only 3). Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      # One PR for all GitHub Actions bumps
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # The Dockerfiles pin node:<version>-alpine@sha256. Dependabot bumps the
    # tag and the digest together, so a Node security release reaches the
    # image instead of a stale pin. Dependabot has no security updates for
    # Docker images, so the 7-day cooldown applies to those releases too:
    # bump by hand for an urgent Node CVE. Majors stay a deliberate choice:
    # move to the next LTS by hand.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the three Dockerfiles' shared base image
      docker:
        patterns:
          - "*"
